name: MLOps - Retraining Pipeline

on:
  schedule:
    # Se ejecuta todos los domingos a las 03:00 AM (Sintaxis Cron)
    - cron: '0 3 * * 0'
  # Permite disparar el script a mano desde la web de GitHub para pruebas
  workflow_dispatch: 

jobs:
  train-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar entorno Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy xgboost scikit-learn onnxmltools

    - name: Ejecutar motor de reentrenamiento
      run: python src/training/train_model.py
      
    - name: Commit del nuevo modelo estático (.onnx)
      run: |
        git config --global user.name "MLOps Bot"
        git config --global user.email "mlops-bot@quantengine.local"
        git add models/quant_model.onnx
        git commit -m "chore(mlops): reentrenamiento semanal de XGBoost" || echo "No hay cambios en el modelo"
        git push